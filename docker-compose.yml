version: '3.8'

services:
  # ====================================================================
  # 1. Apache Kafka & Zookeeper (Real-Time Messaging Backbone)
  # ====================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: datapulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - datapulse_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: datapulse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - datapulse_network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ====================================================================
  # 2. PostgreSQL Relational Data Warehouse
  # ====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: datapulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: datapulse_warehouse
      POSTGRES_USER: datapulse_user
      POSTGRES_PASSWORD: datapulse_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
    networks:
      - datapulse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapulse_user -d datapulse_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # 3. Continuous Event Generator (Kafka Producer)
  # ====================================================================
  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    container_name: datapulse-generator
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GENERATOR_RATE_PER_SECOND: 5.0
      GENERATOR_BURST_PROBABILITY: 0.08
      GENERATOR_ERROR_INJECTION_RATE: 0.04
    networks:
      - datapulse_network
    restart: unless-stopped

  # ====================================================================
  # 4. PySpark Structured Streaming Processor
  # ====================================================================
  spark-streaming:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: datapulse-spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: datapulse_warehouse
      POSTGRES_USER: datapulse_user
      POSTGRES_PASSWORD: datapulse_secure_password
      SPARK_CHECKPOINT_DIR: /tmp/spark-checkpoints/datapulse
    volumes:
      - spark_checkpoints:/tmp/spark-checkpoints/datapulse
    networks:
      - datapulse_network
    restart: unless-stopped

  # ====================================================================
  # 5. Apache Airflow (Scheduler & Webserver)
  # ====================================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: datapulse-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://datapulse_user:datapulse_secure_password@postgres:5432/datapulse_warehouse
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      POSTGRES_HOST: postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
    command: webserver
    networks:
      - datapulse_network
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: datapulse-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://datapulse_user:datapulse_secure_password@postgres:5432/datapulse_warehouse
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      POSTGRES_HOST: postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    networks:
      - datapulse_network
    restart: unless-stopped

  # ====================================================================
  # 6. Streamlit Real-Time Analytics Dashboard
  # ====================================================================
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: datapulse-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: datapulse_warehouse
      POSTGRES_USER: datapulse_user
      POSTGRES_PASSWORD: datapulse_secure_password
      STREAMLIT_AUTO_REFRESH_INTERVAL: 3
    networks:
      - datapulse_network
    restart: unless-stopped

# ====================================================================
# Persistent Named Volumes
# ====================================================================
volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  spark_checkpoints:
    driver: local
  airflow_logs:
    driver: local

# ====================================================================
# Bridge Network
# ====================================================================
networks:
  datapulse_network:
    driver: bridge
